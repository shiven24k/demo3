<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Demo Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
        h1 { color: #333; }
        .demo-box {
            background: #fff;
            border: 1px solid #ddd;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            background: #0078d4;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>
    <div class="demo-box">
        <h1>Welcome to the HTML Deeelo Page</h1>
        <p>This is a simple demonstration of an HTML page with some basic styling and interactivity.</p>
        <button onclick="alert('Hello from the demo page!')">Click Me</button>
    </div>
</body>
</html>
